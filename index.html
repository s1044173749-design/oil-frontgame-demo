<style>
  :root{--bg:#101419;--panel:#171c22;--text:#eef3f8;--muted:#98a5b2;--accent:#e4ac3d}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column}

  #stageWrap{position:relative;flex:1;min-height:0;background:#b58b55}

  #stage canvas{display:block;width:100%;height:100%;touch-action:none}

  #hud .title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#2d343c;color:#dce5ee}
  #status{font-size:14px;font-weight:800;margin-bottom:6px}.hint{font-size:12px;color:#c2ccd6;line-height:1.5}.sub{font-size:11px;color:#8d9aa6;margin-top:5px}
  #pickupBar{height:5px;background:#2e353e;border-radius:999px;overflow:hidden;margin-top:9px;display:none}.fill{height:100%;width:0;background:var(--accent)}
  #actions{position:absolute;right:16px;bottom:18px;display:flex;gap:10px;align-items:center;z-index:4}
  button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:14px;box-shadow:0 7px 20px rgba(0,0,0,.28);cursor:pointer}
  #dropBtn{display:none;background:#f3efe7;color:#1f2328} #resetBtn{background:#242b33;color:#eef3f8;border:1px solid #3a444f}
  #debug{position:absolute;right:14px;top:14px;width:245px;background:rgba(14,18,22,.86);border:1px solid rgba(255,255,255,.11);border-radius:12px;padding:10px 12px;font-size:11px;color:#c8d2dc;line-height:1.55;backdrop-filter:blur(6px);z-index:4}
  #debug b{color:white} #debug.hidden{display:none}
  #joystick{position:absolute;width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);pointer-events:none;display:none;transform:translate(-50%,-50%);z-index:4}
  #stick{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.3);transform:translate(-50%,-50%)}
  #toast{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:10px;background:rgba(12,16,20,.93);border:1px solid rgba(255,255,255,.12);font-weight:800;opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap;z-index:6}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#11161b;color:#dce5ee;font-size:14px;z-index:10}
  @media (max-width:760px){header span{display:none}#debug{display:none}#hud{width:calc(100% - 28px);max-width:none}button{padding:12px 14px}}

<body>
<div id="wrap">
<header><strong>吸石油玩法 · 3D MVP（圆滑侵蚀 + Q弹版）</strong><span>WASD / 方向键移动｜触屏拖动移动｜H：调试｜软管上限：900</span></header>

const CFG = {
  interactionRange: 76, interactionDuration: .9,
  baseSpeed: 205, carrySpeedMul: .88,
  hoseLimit: 900, tensionStart: .72, minAwayMul: .18,
  pullbackDistance: 22, pullbackCooldown: .48,
  suctionRange: 135, suctionHalfAngle: Math.PI/4.5, nearSuctionRadius: 52, preSuction: .1,
  oilCollisionRadius: 25, oilCollisionForwardOffset: 32, oilCollisionSamples: 18,
  suctionCellsPerSec: 18.0, cleanupThreshold: .045, finishDuration: .72,
  // Height-field suction: permanent oil amount and elastic deformation are separate.
  // 主体厚度真实下降：中心区域 0.5~0.8 秒内能看出明显变薄，不再只看到轮廓变化。

const hub = new THREE.Mesh(new THREE.CylinderGeometry(18,18,16,18), dark); hub.rotation.z=Math.PI/2; hub.position.set(37,38,0); hub.castShadow=true; machineGroup.add(hub);

const obstacles=[

const obstacleMeshes=[];
function addObstacle(o,kind){

const playerGroup=new THREE.Group(); scene.add(playerGroup);
const bodyMat=new THREE.MeshStandardMaterial({color:0x356f87,roughness:.82});
const skinMat=new THREE.MeshStandardMaterial({color:0xe2b27d,roughness:.8});
const body=new THREE.Mesh(new THREE.CylinderGeometry(15,18,42,14),bodyMat);body.position.y=30;body.castShadow=true;playerGroup.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(13,16,12),skinMat);head.position.y=62;head.castShadow=true;playerGroup.add(head);
const hat=new THREE.Mesh(new THREE.CylinderGeometry(22,22,4,18),new THREE.MeshStandardMaterial({color:0x4a3525,roughness:.9}));hat.position.y=75;hat.castShadow=true;playerGroup.add(hat);
const nozzle=new THREE.Mesh(new THREE.CylinderGeometry(6,8,34,12),dark); nozzle.rotation.x=Math.PI/2; nozzle.position.set(0,33,25); nozzle.castShadow=true; playerGroup.add(nozzle);

const nozzleVortexGroup=new THREE.Group();
nozzleVortexGroup.position.set(0,18,32);
playerGroup.add(nozzleVortexGroup);
const nozzleVortexParticles=[];
const nozzleVortexGeo=new THREE.SphereGeometry(1,10,8);
for(let i=0;i<28;i++){
  const mat=new THREE.MeshPhysicalMaterial({
    color:0x252d39, roughness:.18, metalness:.02, clearcoat:.62, clearcoatRoughness:.16,
    transparent:true, opacity:.62, emissive:0x2b3646, emissiveIntensity:.22
  });
  const m=new THREE.Mesh(nozzleVortexGeo,mat);
  m.visible=false;
  nozzleVortexGroup.add(m);
  nozzleVortexParticles.push({mesh:m, phase:i/28, lane:(i%6)/5});
}
const nozzleVortexRings=[];
for(let i=0;i<5;i++){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(1,0.55,8,24),
    new THREE.MeshBasicMaterial({color:0x8fd3ff, transparent:true, opacity:.0, depthWrite:false})
  );
  ring.rotation.y=Math.PI/2;
  ring.visible=false;
  nozzleVortexGroup.add(ring);
  nozzleVortexRings.push(ring);
}
function updateNozzleVortexVisual(){
  const live=['CARRY','PRESUCTION','SUCTION','FINISH'].includes(state);
  if(!live){
    nozzleVortexGroup.visible=false;
    for(const p of nozzleVortexParticles)p.mesh.visible=false;
    for(const r of nozzleVortexRings)r.visible=false;
    return;
  }
  nozzleVortexGroup.visible=true;
  const now=performance.now()/1000;
  let strength=.58, speed=1.0, alpha=.42;
  if(state==='CARRY'){ strength=.62; speed=1.02; alpha=.34; }
  else if(state==='PRESUCTION'){ strength=1.02; speed=1.42; alpha=.60; }
  else if(state==='SUCTION'){ strength=1.48; speed=2.02; alpha=.86; }
  else if(state==='FINISH'){ strength=1.20; speed=1.66; alpha=.70; }
  if(state==='SUCTION'&&suctionPulseStrength>0){strength*=1+suctionPulseStrength*.16;speed*=1+suctionPulseStrength*.12;alpha=Math.min(1,alpha+suctionPulseStrength*.08)}
  let vortexRadiusMul=1;
  if(state==='FINISH'){
    const fp=Math.max(0,Math.min(1,finishT/Math.max(.001,CFG.finishDuration)));
    vortexRadiusMul=lerp(1,.46,smoothstep01(fp));
    speed*=1+.42*fp;
  }

  const rangeLen=CFG.suctionRange;
  const halfA=CFG.suctionHalfAngle;
  const minZ=6;
  const maxZ=rangeLen*.96;

  // 粒子构成一个与吸取扇形几乎同范围的锥形龙卷：远端更宽，靠近吸头更细更亮。
  for(const p of nozzleVortexParticles){
    const mesh=p.mesh;
    mesh.visible=true;
    const tt=((now*speed*0.94 + p.phase*1.38) % 1 + 1) % 1;
    const travel=1-tt; // 1 = 远端, 0 = 靠近吸头
    const lz=minZ + travel*(maxZ-minZ);
    const fanR=Math.sin(halfA)*lz;
    const ang=now*(8.4*speed) + p.phase*Math.PI*2.0 + p.lane*.55;
    const radius=(fanR*(.38 + .42*p.lane) + Math.sin(now*4.8+p.phase*9)*1.1) * strength * vortexRadiusMul;
    const lx=Math.cos(ang)*radius;
    const ly=Math.sin(ang)*radius*.38 + 7 + Math.sin(now*5.2+p.phase*10)*1.2*strength;
    mesh.position.set(lx,ly,lz);
    const s=(1.3 + travel*2.6 + p.lane*.45) * (.76 + .32*strength);
    mesh.scale.set(s, s*.86, s);
    mesh.material.opacity=(alpha*(.26 + .74*travel));
    mesh.material.emissiveIntensity=.12 + .28*strength + .16*(1-travel);
  }

  for(let i=0;i<nozzleVortexRings.length;i++){
    const r=nozzleVortexRings[i];
    r.visible=true;
    const t=((now*speed*0.70 + i*.19) % 1 + 1) % 1;
    const travel=1-t;
    const lz=minZ + travel*(rangeLen*.82);
    const fanR=Math.sin(halfA)*lz;
    const radius=(fanR*.72 + 6) * (.72 + .26*strength) * vortexRadiusMul;
    r.position.set(0,7,lz);
    r.scale.set(radius,radius*.60,1);
    r.material.opacity=(.10 + .20*strength) * (.22 + .78*travel);
    r.rotation.z=now*(1.8 + i*.35);
  }
}

let oilCells=[], oilMesh=null, initialOilCount=0;
let oilSurfaceDirty=true, oilSurfaceLastUpdate=-999;

}

const oilTransferGeo=new THREE.SphereGeometry(1,14,10);
const oilTransferEvents=[];

function smoothstep01(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function createOilSurfaceGeometry(){
  const cols=OIL_SURFACE.cols, rows=OIL_SURFACE.rows;
  const verts=[], uvs=[], indices=[];
  for(let rz=0;rz<=rows;rz++){
    const vz=rz/rows;
    const z=lerp(OIL_SURFACE.minZ,OIL_SURFACE.maxZ,vz);
    for(let cx=0;cx<=cols;cx++){
      const ux=cx/cols;
      const x=lerp(OIL_SURFACE.minX,OIL_SURFACE.maxX,ux);
      verts.push(x,-2.4,z);
      uvs.push(ux,vz);
    }
  }
  const stride=cols+1;
  for(let rz=0;rz<rows;rz++){
    for(let cx=0;cx<cols;cx++){

const suctionRangeGroup=new THREE.Group();suctionRangeGroup.position.set(0,2.2,32);playerGroup.add(suctionRangeGroup);const suctionRangeMat=new THREE.MeshBasicMaterial({color:0xf3c64f,transparent:true,opacity:.20,side:THREE.DoubleSide,depthWrite:false});const suctionRangeMesh=new THREE.Mesh(makeSuctionRangeGeometry(CFG.suctionRange,CFG.suctionHalfAngle),suctionRangeMat);suctionRangeMesh.renderOrder=3;suctionRangeGroup.add(suctionRangeMesh);const suctionRangeLineMat=new THREE.LineBasicMaterial({color:0xffdc72,transparent:true,opacity:.88,depthTest:false});const suctionRangeOutline=new THREE.Line(makeSuctionRangeOutline(CFG.suctionRange,CFG.suctionHalfAngle),suctionRangeLineMat);suctionRangeOutline.renderOrder=4;suctionRangeGroup.add(suctionRangeOutline);const nearRangeMat=new THREE.MeshBasicMaterial({color:0xf3c64f,transparent:true,opacity:.14,side:THREE.DoubleSide,depthWrite:false});const nearRangeMesh=new THREE.Mesh(new THREE.CircleGeometry(CFG.nearSuctionRadius,40),nearRangeMat);nearRangeMesh.rotation.x=-Math.PI/2;nearRangeMesh.position.y=.03;nearRangeMesh.renderOrder=3;suctionRangeGroup.add(nearRangeMesh);const nearRangeLineMat=new THREE.LineBasicMaterial({color:0xffdc72,transparent:true,opacity:.78,depthTest:false});const nearPts=[];for(let i=0;i<=40;i++){const a=i/40*Math.PI*2;nearPts.push(new THREE.Vector3(Math.cos(a)*CFG.nearSuctionRadius,.06,Math.sin(a)*CFG.nearSuctionRadius))}const nearRangeOutline=new THREE.Line(new THREE.BufferGeometry().setFromPoints(nearPts),nearRangeLineMat);nearRangeOutline.renderOrder=4;suctionRangeGroup.add(nearRangeOutline);suctionRangeGroup.visible=false;
let keys={},touchVec={x:0,z:0},pointerId=null,joyOrigin=null,showDebug=false;

const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z),dot=(a,b)=>a.x*b.x+a.z*b.z,norm=v=>{const m=Math.hypot(v.x,v.z)||1;return{x:v.x/m,z:v.z/m}},lerp=(a,b,t)=>a+(b-a)*t;
function clampPlayer(){player.x=Math.max(-WORLD.w/2+24,Math.min(WORLD.w/2-24,player.x));player.z=Math.max(-WORLD.d/2+24,Math.min(WORLD.d/2-24,player.z))}

function smoothHeightFieldErosion(dt,centerX,centerZ){
  if(!oilRestHeight)return{removed:0,weightedX:0,weightedZ:0,weight:0};const cols=OIL_SURFACE.cols,rows=OIL_SURFACE.rows,gridW=cols+1;const radius=CFG.heightErosionSmoothRadius;const alpha=1-Math.pow(1-CFG.heightErosionSmoothAlpha,Math.max(.45,dt*60));const slopeAlpha=1-Math.pow(1-CFG.heightSlopeClampAlpha,Math.max(.45,dt*60));let removed=0,weightedX=0,weightedZ=0,weight=0;
  for(let pass=0;pass<CFG.heightErosionSmoothPasses;pass++){const src=oilRestHeight.slice();for(let rz=0;rz<=rows;rz++){for(let cx=0;cx<=cols;cx++){const i=oilGridIndex(cx,rz),h=src[i];if(h<=0)continue;const p=oilGridWorld(cx,rz);if(Math.hypot(p.x-centerX,p.z-centerZ)>radius)continue;let sum=0,wsum=0,minNeighbor=Infinity;for(let dz=-1;dz<=1;dz++){const zz=rz+dz;if(zz<0||zz>rows)continue;for(let dx=-1;dx<=1;dx++){const xx=cx+dx;if(xx<0||xx>cols||(dx===0&&dz===0))continue;const nh=src[oilGridIndex(xx,zz)];const w=(dx===0||dz===0)?2:1;sum+=nh*w;wsum+=w;if(nh<minNeighbor)minNeighbor=nh}}if(!wsum)continue;const avg=sum/wsum;let next=h;if(avg<h)next=Math.min(next,lerp(h,avg,alpha));if(Number.isFinite(minNeighbor)){const maxAllowed=minNeighbor+CFG.heightMaxNeighborSlope;if(next>maxAllowed)next=Math.min(next,lerp(next,maxAllowed,slopeAlpha))}if(next>0&&next<CFG.heightThinFastStart){const thin=1-next/CFG.heightThinFastStart;next=Math.max(0,next-CFG.heightSuctionSpeed*(CFG.heightThinFastMul-1)*thin*dt*.48)}if(next<CFG.heightThinSnap)next=0;if(next<oilRestHeight[i]){const delta=oilRestHeight[i]-next;oilRestHeight[i]=next;removed+=delta;weightedX+=p.x*delta;weightedZ+=p.z*delta;weight+=delta}}}}
  return{removed,weightedX,weightedZ,weight};
}
function applyHeightFieldSuction(dt){
  if(state!=='SUCTION'||!oilRestHeight)return 0;const n=nozzlePos();const pulseMul=1+suctionPulseStrength*(CFG.heightSuctionPulseMul-1);const impulseMul=1+suctionPulseStrength*(CFG.springPulseImpulseMul-1);const cols=OIL_SURFACE.cols,rows=OIL_SURFACE.rows,gridW=cols+1;let removed=0,weightedX=0,weightedZ=0,weight=0;
  for(let rz=0;rz<=rows;rz++){for(let cx=0;cx<=cols;cx++){const i=oilGridIndex(cx,rz),rest=oilRestHeight[i];if(rest<=CFG.heightClearThreshold)continue;const p=oilGridWorld(cx,rz);const vx=p.x-n.x,vz=p.z-n.z,d=Math.hypot(vx,vz);if(!pointInSuctionZoneXZ(p.x,p.z))continue;const radial=Math.max(0,1-d/CFG.heightSuctionRadius);const edgeBrush=smoothstep01(radial);const brush=d<=CFG.heightSuctionNearRadius?1:Math.pow(edgeBrush,1.55);const initial=Math.max(1,oilInitialRestHeight[i]||rest);const ratio=Math.max(0,Math.min(1,rest/initial));const thin=1-smoothstep01((ratio-.06)/.48);const thinBoost=1+(CFG.heightThinFastMul-1)*thin;const amount=Math.min(rest,CFG.heightSuctionSpeed*pulseMul*thinBoost*(.08+.92*brush)*dt);if(amount<=0)continue;const prev=rest;oilRestHeight[i]=Math.max(0,rest-amount);if(oilRestHeight[i]<CFG.heightThinSnap)oilRestHeight[i]=0;const actual=prev-oilRestHeight[i];removed+=actual;weightedX+=p.x*actual;weightedZ+=p.z*actual;weight+=actual;const elastic=smoothstep01((prev-CFG.heightSpringFadeStart)/Math.max(.001,CFG.heightSpringFull-CFG.heightSpringFadeStart));if(elastic>.01){oilSpringV[i]-=CFG.springSuctionImpulse*impulseMul*elastic*(.28+.72*brush)*dt;const kick=-CFG.springSuctionImpulse*CFG.springNeighborImpulse*impulseMul*elastic*(.20+.80*brush)*dt;if(cx>0)oilSpringV[i-1]+=kick;if(cx<cols)oilSpringV[i+1]+=kick;if(rz>0)oilSpringV[i-gridW]+=kick;if(rz<rows)oilSpringV[i+gridW]+=kick}}}

}
function drainHeightFieldFinish(dt){if(!oilRestHeight)return;const rate=5.4*dt;for(let i=0;i<oilRestHeight.length;i++){const prev=oilRestHeight[i];if(prev<=0)continue;oilRestHeight[i]=Math.max(0,prev*(1-rate)-18*dt);oilSpringV[i]-=42*dt}oilSurfaceDirty=true}
