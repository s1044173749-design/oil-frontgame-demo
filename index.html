<!doctype html>
<html lang="zh-CN">
<head>

<title>吸石油玩法 3D MVP Demo</title>
<style>
  :root{--bg:#101419;--panel:#171c22;--text:#eef3f8;--muted:#98a5b2;--accent:#e4ac3d}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column}
  header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0b0f13;border-bottom:1px solid #242b33;gap:12px;z-index:5}
  header strong{font-size:15px} header span{font-size:12px;color:var(--muted)}
  #stageWrap{position:relative;flex:1;min-height:0;background:#b58b55}
  #stage{position:absolute;inset:0;touch-action:none;cursor:grab} #stage:active{cursor:grabbing}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:14px;top:14px;width:min(370px,calc(100% - 28px));background:rgba(14,18,22,.86);border:1px solid rgba(255,255,255,.11);border-radius:12px;padding:12px 14px;backdrop-filter:blur(7px);pointer-events:none;z-index:4}
  #hud .title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#2d343c;color:#dce5ee}
  #status{font-size:14px;font-weight:800;margin-bottom:6px}.hint{font-size:12px;color:#c2ccd6;line-height:1.5}.sub{font-size:11px;color:#8d9aa6;margin-top:5px}
  #pickupBar{height:5px;background:#2e353e;border-radius:999px;overflow:hidden;margin-top:9px;display:none}.fill{height:100%;width:0;background:var(--accent)}
  #actions{position:absolute;right:16px;bottom:18px;display:flex;gap:10px;align-items:center;z-index:4}
  button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:14px;box-shadow:0 7px 20px rgba(0,0,0,.28);cursor:pointer}
  #dropBtn{display:none;background:#f3efe7;color:#1f2328} #resetBtn{background:#242b33;color:#eef3f8;border:1px solid #3a444f}
  #debug{position:absolute;right:14px;top:14px;width:245px;background:rgba(14,18,22,.86);border:1px solid rgba(255,255,255,.11);border-radius:12px;padding:10px 12px;font-size:11px;color:#c8d2dc;line-height:1.55;backdrop-filter:blur(6px);z-index:4}
  #debug b{color:white} #debug.hidden{display:none}
  #joystick{position:absolute;width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);pointer-events:none;display:none;transform:translate(-50%,-50%);z-index:4}
  #stick{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.3);transform:translate(-50%,-50%)}
  #toast{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:10px;background:rgba(12,16,20,.93);border:1px solid rgba(255,255,255,.12);font-weight:800;opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap;z-index:6}

<div id="wrap">

<script type="module">
import * as THREE from 'three';

for(let i=0;i<34;i++){

const tank = new THREE.Mesh(new THREE.CylinderGeometry(22,22,62,18), dark); tank.rotation.z=Math.PI/2; tank.position.set(0,60,0); tank.castShadow=true; machineGroup.add(tank);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(18,18,16,18), dark); hub.rotation.z=Math.PI/2; hub.position.set(37,38,0); hub.castShadow=true; machineGroup.add(hub);
const lampMat = new THREE.MeshStandardMaterial({color:0x553b12, emissive:0x000000});
const lamp = new THREE.Mesh(new THREE.SphereGeometry(5,12,8),lampMat); lamp.position.set(-20,62,29); machineGroup.add(lamp);

const pickupRing = new THREE.Mesh(new THREE.RingGeometry(CFG.interactionRange-2,CFG.interactionRange+2,64),ringMat); pickupRing.rotation.x=-Math.PI/2; pickupRing.position.set(machine.x,1.3,machine.z); scene.add(pickupRing);

const obstacles=[

const obstacleMeshes=[];
function addObstacle(o,kind){

}
addObstacle(obstacles[0],'crate'); addObstacle(obstacles[1],'barrels');

const playerGroup=new THREE.Group(); scene.add(playerGroup);
const bodyMat=new THREE.MeshStandardMaterial({color:0x356f87,roughness:.82});
const skinMat=new THREE.MeshStandardMaterial({color:0xe2b27d,roughness:.8});
const body=new THREE.Mesh(new THREE.CylinderGeometry(15,18,42,14),bodyMat);body.position.y=30;body.castShadow=true;playerGroup.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(13,16,12),skinMat);head.position.y=62;head.castShadow=true;playerGroup.add(head);
const hat=new THREE.Mesh(new THREE.CylinderGeometry(22,22,4,18),new THREE.MeshStandardMaterial({color:0x4a3525,roughness:.9}));hat.position.y=75;hat.castShadow=true;playerGroup.add(hat);
const nozzle=new THREE.Mesh(new THREE.CylinderGeometry(6,8,34,12),dark); nozzle.rotation.x=Math.PI/2; nozzle.position.set(0,33,25); nozzle.castShadow=true; playerGroup.add(nozzle);

const nozzleVortexGroup=new THREE.Group();
nozzleVortexGroup.position.set(0,18,32);
playerGroup.add(nozzleVortexGroup);
const nozzleVortexParticles=[];
const nozzleVortexGeo=new THREE.SphereGeometry(1,10,8);
for(let i=0;i<28;i++){
  const mat=new THREE.MeshPhysicalMaterial({
    color:0x252d39, roughness:.18, metalness:.02, clearcoat:.62, clearcoatRoughness:.16,
    transparent:true, opacity:.62, emissive:0x2b3646, emissiveIntensity:.22
  });
  const m=new THREE.Mesh(nozzleVortexGeo,mat);
  m.visible=false;
  nozzleVortexGroup.add(m);
  nozzleVortexParticles.push({mesh:m, phase:i/28, lane:(i%6)/5});
}
const nozzleVortexRings=[];
for(let i=0;i<5;i++){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(1,0.55,8,24),
    new THREE.MeshBasicMaterial({color:0x8fd3ff, transparent:true, opacity:.0, depthWrite:false})
  );
  ring.rotation.y=Math.PI/2;
  ring.visible=false;
  nozzleVortexGroup.add(ring);
  nozzleVortexRings.push(ring);
}
function updateNozzleVortexVisual(){
  const live=['CARRY','PRESUCTION','SUCTION','FINISH'].includes(state);
  if(!live){
    nozzleVortexGroup.visible=false;
    for(const p of nozzleVortexParticles)p.mesh.visible=false;
    for(const r of nozzleVortexRings)r.visible=false;
    return;
  }
  nozzleVortexGroup.visible=true;
  const now=performance.now()/1000;
  let strength=.58, speed=1.0, alpha=.42;
  if(state==='CARRY'){ strength=.62; speed=1.02; alpha=.34; }
  else if(state==='PRESUCTION'){ strength=1.02; speed=1.42; alpha=.60; }
  else if(state==='SUCTION'){ strength=1.48; speed=2.02; alpha=.86; }
  else if(state==='FINISH'){ strength=1.20; speed=1.66; alpha=.70; }
  if(state==='SUCTION'&&suctionPulseStrength>0){strength*=1+suctionPulseStrength*.16;speed*=1+suctionPulseStrength*.12;alpha=Math.min(1,alpha+suctionPulseStrength*.08)}
  let vortexRadiusMul=1;
  if(state==='FINISH'){
    const fp=Math.max(0,Math.min(1,finishT/Math.max(.001,CFG.finishDuration)));
    vortexRadiusMul=lerp(1,.46,smoothstep01(fp));
    speed*=1+.42*fp;
  }

  const rangeLen=CFG.suctionRange;
  const halfA=CFG.suctionHalfAngle;
  const minZ=6;
  const maxZ=rangeLen*.96;

  // 粒子构成一个与吸取扇形几乎同范围的锥形龙卷：远端更宽，靠近吸头更细更亮。
  for(const p of nozzleVortexParticles){
    const mesh=p.mesh;
    mesh.visible=true;
    const tt=((now*speed*0.94 + p.phase*1.38) % 1 + 1) % 1;
    const travel=1-tt; // 1 = 远端, 0 = 靠近吸头
    const lz=minZ + travel*(maxZ-minZ);
    const fanR=Math.sin(halfA)*lz;
    const ang=now*(8.4*speed) + p.phase*Math.PI*2.0 + p.lane*.55;
    const radius=(fanR*(.38 + .42*p.lane) + Math.sin(now*4.8+p.phase*9)*1.1) * strength * vortexRadiusMul;
    const lx=Math.cos(ang)*radius;
    const ly=Math.sin(ang)*radius*.38 + 7 + Math.sin(now*5.2+p.phase*10)*1.2*strength;
    mesh.position.set(lx,ly,lz);
    const s=(1.3 + travel*2.6 + p.lane*.45) * (.76 + .32*strength);
    mesh.scale.set(s, s*.86, s);
    mesh.material.opacity=(alpha*(.26 + .74*travel));
    mesh.material.emissiveIntensity=.12 + .28*strength + .16*(1-travel);
  }

  for(let i=0;i<nozzleVortexRings.length;i++){
    const r=nozzleVortexRings[i];
    r.visible=true;
    const t=((now*speed*0.70 + i*.19) % 1 + 1) % 1;
    const travel=1-t;
    const lz=minZ + travel*(rangeLen*.82);
    const fanR=Math.sin(halfA)*lz;
    const radius=(fanR*.72 + 6) * (.72 + .26*strength) * vortexRadiusMul;
    r.position.set(0,7,lz);
    r.scale.set(radius,radius*.60,1);
    r.material.opacity=(.10 + .20*strength) * (.22 + .78*travel);
    r.rotation.z=now*(1.8 + i*.35);
  }
}

// Rope is built from reusable cylinder segments.

}

const OIL_SURFACE={

// V0.1 V2：显式“油舌”连接主体油面与吸头；断开的油坨飞到吸头后才真正删除。
const oilTongueGroup=new THREE.Group();scene.add(oilTongueGroup);

for(let i=0;i<9;i++){
  const m=new THREE.Mesh(oilTongueGeo,oilMat.clone());

}
const oilTransferGroup=new THREE.Group();scene.add(oilTransferGroup);
const oilTransferGeo=new THREE.SphereGeometry(1,14,10);
const oilTransferEvents=[];

function smoothstep01(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function createOilSurfaceGeometry(){
  const cols=OIL_SURFACE.cols, rows=OIL_SURFACE.rows;
  const verts=[], uvs=[], indices=[];
  for(let rz=0;rz<=rows;rz++){
    const vz=rz/rows;
    const z=lerp(OIL_SURFACE.minZ,OIL_SURFACE.maxZ,vz);
    for(let cx=0;cx<=cols;cx++){
      const ux=cx/cols;
      const x=lerp(OIL_SURFACE.minX,OIL_SURFACE.maxX,ux);
      verts.push(x,-2.4,z);
      uvs.push(ux,vz);
    }
  }
  const stride=cols+1;
  for(let rz=0;rz<rows;rz++){
    for(let cx=0;cx<cols;cx++){
      const a=rz*stride+cx,b=a+1,c=a+stride,d=c+1;
      indices.push(a,c,b,b,c,d);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}
function buildOil(){
  if(oilMesh){scene.remove(oilMesh);oilMesh.geometry.dispose();}
  oilCells=[];
  const step=18;
  const blobs=[{x:330,z:-30,rx:210,rz:150},{x:405,z:135,rx:165,rz:110},{x:230,z:165,rx:120,rz:82}];
  for(let z=-WORLD.d/2+35;z<WORLD.d/2-25;z+=step){for(let x=40;x<WORLD.w/2-30;x+=step){
    let inside=false; for(const b of blobs){const dx=(x-b.x)/b.rx,dz=(z-b.z)/b.rz;if(dx*dx+dz*dz<1){inside=true;break}}
    const deterministic=((Math.floor((x+700)/step)*17+Math.floor((z+500)/step)*31)%23)!==0;
    if(inside&&deterministic){
      const noise=((x*7+z*11)%19+19)%19/19;
      // 逻辑仍然是独立 Cell；视觉由这些 Cell 共同生成连续油面。
      const height=10+noise*15;
      const blobRadius=15+noise*6;
      const squash=.64+noise*.16;
      const wobbleSeed=(x*13.7+z*7.9)%Math.PI;
      oilCells.push({x,z,active:true,pendingRemoval:false,visualStrength:1,targetStrength:1,removedAt:-999,noise,height,blobRadius,squash,wobbleSeed,index:oilCells.length});
    }
  }}
  initialOilCount=oilCells.length;
  oilMesh=new THREE.Mesh(createOilSurfaceGeometry(),oilMat);
  const vCount=oilMesh.geometry.attributes.position.count;
  oilSpringY=new Float32Array(vCount);
  oilSpringV=new Float32Array(vCount);
  oilSpringY.fill(OIL_SURFACE.surfaceBaseY);
  oilSpringV.fill(0);
  oilMesh.receiveShadow=true;
  oilMesh.castShadow=false;
  oilMesh.frustumCulled=false;
  scene.add(oilMesh);
  oilSurfaceDirty=true;
  updateOilSurface(0,true);
}
function updateOilCellVisuals(dt){
  let changed=false;
  for(const c of oilCells){
    const prev=c.visualStrength;
    c.visualStrength = lerp(c.visualStrength, c.targetStrength, 1-Math.exp(-OIL_SURFACE.visualLerpSpeed*dt));
    if(Math.abs(c.visualStrength-c.targetStrength)<0.003) c.visualStrength=c.targetStrength;
    if(Math.abs(c.visualStrength-prev)>0.0005) changed=true;
  }
  if(changed) oilSurfaceDirty=true;
}
function oilDensityAt(x,z){
  let density=0;
  for(const c of oilCells){
    const strength=c.visualStrength||0;
    if(strength<=0.001)continue;
    const dx=x-c.x,dz=z-c.z;
    const r=(OIL_SURFACE.influenceRadius + c.noise*10) * (.94 + strength*.10);
    const d2=dx*dx+dz*dz;
    if(d2>=r*r)continue;
    const d=Math.sqrt(d2);
    const q=1-d/r;
    // 类 metaball 密度核：多个 Cell 的场相加后自然融合。
    density += (q*q*(.82+.75*q)) * strength;
  }
  return density;
}
function oilReboundAt(x,z,time){
  let h=0;
  for(const c of oilCells){
    if(c.active || c.removedAt<0) continue;
    const age=time-c.removedAt;
    if(age<0 || age>OIL_SURFACE.reboundDuration) continue;
    const dx=x-c.x,dz=z-c.z;
    const d=Math.hypot(dx,dz);
    const r=OIL_SURFACE.reboundRadius;
    if(d>=r) continue;
    // 形成一个环状回弹：洞边鼓起再缓慢回落。
    const ringCenter=r*.52;
    const ringWidth=r*.32;
    const ring=Math.max(0,1-Math.abs(d-ringCenter)/ringWidth);
    const t=age/OIL_SURFACE.reboundDuration;
    const spring=Math.sin(t*Math.PI) * (1-t);
    h += ring * spring * 4.8;
  }
  return h;
}
function oilTractionAt(x,z,time){
  if(!(state==='PRESUCTION' || state==='SUCTION' || state==='FINISH')) return 0;
  const n=nozzlePos();
  const tx=targetCell?targetCell.x:n.x+facing.x*44;
  const tz=targetCell?targetCell.z:n.z+facing.z*44;
  const cx=lerp(tx,n.x,.35), cz=lerp(tz,n.z,.35);
  const dx=x-cx,dz=z-cz;
  const d=Math.hypot(dx,dz);
  if(d>=OIL_SURFACE.tractionRadius) return 0;
  const t=1-d/OIL_SURFACE.tractionRadius;
  const pulse=.84 + .16*Math.sin(time*10.5 + d*.08);
  let strength = (state==='PRESUCTION') ? 2.6 : (state==='SUCTION' ? 4.3 : 3.4);
  if(state==='SUCTION') strength*=1+suctionPulseStrength*.72;
  return Math.pow(t,1.65) * strength * pulse;
}
function oilStringTractionAt(x,z,time){
  if(!(state==='PRESUCTION' || state==='SUCTION' || state==='FINISH')) return {x:0,z:0,lift:0};
  const n=nozzlePos();
  const tx=targetCell?targetCell.x:n.x+facing.x*34;
  const tz=targetCell?targetCell.z:n.z+facing.z*34;
  const vx=n.x-tx, vz=n.z-tz;
  const len=Math.hypot(vx,vz);
  if(len<1) return {x:0,z:0,lift:0};
  const dirx=vx/len, dirz=vz/len;
  const px=x-tx, pz=z-tz;
  const along=px*dirx + pz*dirz;
  const maxLen=len+OIL_SURFACE.stringLengthPad;
  if(along<-10 || along>maxLen) return {x:0,z:0,lift:0};
  const lateral=Math.abs(px*(-dirz) + pz*(dirx));
  const normalized=Math.max(0,Math.min(1,along/Math.max(1,maxLen)));

  // 正确的“拉丝”方向：主要把油面顶点沿 XZ 平面朝吸头方向拽，Y 轴只做少量抬升。
  const widthBase=OIL_SURFACE.stringWidth * (1.12 - normalized*.62);
  const widthPulse=1 + 0.06*Math.sin(time*9.2 - along*0.04);
  const width=Math.max(4.2, widthBase*widthPulse);
  if(lateral>width) return {x:0,z:0,lift:0};

  const core=Math.max(0,1-lateral/width);
  const strand=Math.pow(core,2.7);
  const neck=Math.exp(-Math.pow((normalized-.70)/.18,2));
  const root=Math.exp(-Math.pow((normalized-.24)/.27,2));
  const tip=Math.exp(-Math.pow((normalized-.92)/.11,2));
  const suctionPulse=.88 + .12*Math.sin(time*15.0 - along*0.11) + .05*Math.sin(time*22.0 - along*0.17);
  const stateMul = state==='PRESUCTION' ? .72 : state==='SUCTION' ? 1.18 : 1.0;
  const gulpPullMul=state==='SUCTION' ? 1+suctionPulseStrength*1.05 : 1;
  const gulpLiftMul=state==='SUCTION' ? 1+suctionPulseStrength*.42 : 1;

  // 水平牵引远大于垂直抬升，视觉上像被吸头“拽过去”，而不是往上长。
  const horizontalProfile=(root*.7 + neck*2.2 + tip*1.4) * (.52+.32*normalized);
  const liftProfile=(root*.35 + neck*.8 + tip*.45) * (.50+.20*normalized);
  const pull= strand * horizontalProfile * suctionPulse * stateMul * gulpPullMul;
  const lift= strand * liftProfile * suctionPulse * stateMul * gulpLiftMul;
  return {x:dirx*pull,z:dirz*pull,lift};
}
function oilBackflowAt(x,z,time){
  let h=0;
  for(const c of oilCells){
    if(c.active || c.removedAt<0) continue;
    const age=time-c.removedAt;
    const delay=OIL_SURFACE.reboundDuration*.38;
    if(age<delay || age>delay+OIL_SURFACE.backflowDuration) continue;
    const local=(age-delay)/OIL_SURFACE.backflowDuration;
    const dx=x-c.x,dz=z-c.z;
    const d=Math.hypot(dx,dz);
    const r=OIL_SURFACE.backflowRadius;
    if(d>=r) continue;
    const inward=Math.max(0,1-d/r);
    const ring=Math.max(0,1-Math.abs(d-r*.40)/(r*.34));
    const settle=Math.sin(Math.min(1,local)*Math.PI*.92)*(1-local*.22);
    const sticky=Math.max(ring*.95, Math.pow(inward,1.7)*.42);
    h += sticky * settle * 4.6;
  }
  return h;
}

function oilPeelAt(x,z,time){
  if(!(state==='PRESUCTION' || state==='SUCTION' || state==='FINISH') || !targetCell) return {x:0,z:0,lift:0};
  const n=nozzlePos();
  const dir=norm({x:n.x-targetCell.x,z:n.z-targetCell.z});
  const side={x:-dir.z,z:dir.x};
  const px=x-targetCell.x, pz=z-targetCell.z;
  const along=px*dir.x + pz*dir.z;
  const lateral=Math.abs(px*side.x + pz*side.z);
  const radial=Math.hypot(px,pz);
  const ring=Math.max(0,1-Math.abs(radial-CFG.peelRadius)/13.5);
  const front=smoothstep01((along+6)/24) * (1-smoothstep01((along-30)/16));
  const latMask=Math.max(0,1-lateral/17);
  const pulse=.82 + .18*Math.sin(time*12.6 + radial*.05);
  const stateMul=state==='PRESUCTION'?.76:state==='SUCTION'?1.16:.98;
  const a=ring*front*latMask*pulse*stateMul;
  // 强化朝吸头方向的 stretch，同时保留少量 lift，让边缘像被揪起的厚史莱姆。
  return {x:dir.x*a*2.8,z:dir.z*a*2.8,lift:a*CFG.peelLift};
}
function oilVolumeBulgeAt(x,z,time){
  if(!(state==='PRESUCTION' || state==='SUCTION' || state==='FINISH') || !targetCell) return 0;
  const n=nozzlePos();
  const dir=norm({x:n.x-targetCell.x,z:n.z-targetCell.z});
  // 受力点后方一点作为“挤压中心”，中心被吸下去时，旁边一圈更明显地鼓起来，形成厚史莱姆被挤开的感觉。
  const cx=targetCell.x - dir.x*10;
  const cz=targetCell.z - dir.z*10;
  const d=Math.hypot(x-cx,z-cz);
  const inner=CFG.volumeBulgeInner, outer=CFG.volumeBulgeOuter;
  if(d<inner || d>outer) return 0;
  const mid=inner + (outer-inner)*.42;
  const half=(outer-inner)*.58;
  const ring=Math.max(0,1-Math.abs(d-mid)/half);
  const shoulder=Math.max(0,1-Math.abs(d-(mid+10))/(half*1.15));
  const pulse=.84 + .16*Math.sin(time*10.2 + d*.07);
  const stateMul=state==='PRESUCTION'?.76:state==='SUCTION'?1.22:.98;
  return (Math.pow(ring,1.08)*.82 + Math.pow(shoulder,1.45)*.46) * pulse * CFG.volumeBulgeAmp * stateMul;
}
function oilMassPullAt(x,z){
  if(!(state==='PRESUCTION'||state==='SUCTION') || !targetCell)return {x:0,z:0,lift:0};
  const n=nozzlePos();
  const tx=targetCell.x,tz=targetCell.z;
  const dx=x-tx,dz=z-tz,d=Math.hypot(dx,dz);
  if(d>=CFG.oilMassPullRadius)return {x:0,z:0,lift:0};
  const vx=n.x-tx,vz=n.z-tz,len=Math.hypot(vx,vz)||1;
  const dirx=vx/len,dirz=vz/len;
  const influence=Math.pow(1-d/CFG.oilMassPullRadius,1.35);
  const stateMul=state==='PRESUCTION'?.42:1;
  const pull=(CFG.oilMassPullDistance+CFG.oilMassPulseDistance*suctionPulseStrength)*influence*stateMul;
  const lift=(4.0+5.5*suctionPulseStrength)*Math.pow(influence,1.6)*stateMul;
  return {x:dirx*pull,z:dirz*pull,lift};
}
function oilSuctionDentAt(x,z){
  if(state!=='SUCTION' || !targetCell) return 0;
  const n=nozzlePos();
  const cx=lerp(targetCell.x,n.x,.22), cz=lerp(targetCell.z,n.z,.22);
  const d=Math.hypot(x-cx,z-cz);
  if(d>=CFG.suctionDentRadius) return 0;
  const q=1-d/CFG.suctionDentRadius;
  const depth=CFG.suctionDentDepth + CFG.suctionDentPulseDepth*suctionPulseStrength;
  return -Math.pow(q,1.65)*depth;
}
function oilPressureWaveAt(x,z,time){
  if(!(state==='PRESUCTION' || state==='SUCTION' || state==='FINISH')) return 0;
  const n=nozzlePos();
  const cx=targetCell?targetCell.x:lerp(player.x,n.x,.6);
  const cz=targetCell?targetCell.z:lerp(player.z,n.z,.6);
  const d=Math.hypot(x-cx,z-cz);
  const maxR=state==='FINISH'?126:108;
  if(d>maxR) return 0;
  // 用距离相位延迟来模拟“中心先动，外圈晚一点跟着 duang”的传播感。
  const phase=time*10.6 - d*0.18;
  const wave=Math.max(0,Math.sin(phase));
  const envelope=(1-d/maxR)*(0.72 + 0.28*Math.sin(time*5.4));
  const stateMul=state==='PRESUCTION'?.56:state==='SUCTION'?1.0:.80;
  return wave*envelope*CFG.pressureWaveAmp*stateMul;
}
function updateOilSurface(time,force=false){
  if(!oilMesh)return;
  if(!force && !oilSurfaceDirty && time-oilSurfaceLastUpdate < 1/OIL_SURFACE.updateHz)return;

  const prevUpdate=oilSurfaceLastUpdate;
  const dt = force || prevUpdate < -100 ? 1/OIL_SURFACE.updateHz : Math.max(.012,Math.min(.055,time-prevUpdate));
  oilSurfaceLastUpdate=time;

  const pos=oilMesh.geometry.attributes.position;
  const arr=pos.array;
  const cols=OIL_SURFACE.cols, rows=OIL_SURFACE.rows;
  const gridW=cols+1, gridH=rows+1;
  const count=gridW*gridH;

  if(!oilSpringY || oilSpringY.length!==count){
    oilSpringY=new Float32Array(count);
    oilSpringV=new Float32Array(count);
    oilSpringY.fill(OIL_SURFACE.surfaceBaseY);
  }

  let dens=new Float32Array(count);
  let idx=0;
  for(let rz=0;rz<=rows;rz++){
    const vz=rz/rows;
    const z=lerp(OIL_SURFACE.minZ,OIL_SURFACE.maxZ,vz);
    for(let cx=0;cx<=cols;cx++){
      const ux=cx/cols;
      const x=lerp(OIL_SURFACE.minX,OIL_SURFACE.maxX,ux);
      dens[idx++]=oilDensityAt(x,z);
    }
  }

  // 先平滑密度场，避免 Oil Cell / 固定网格在边缘形成锯齿状轮廓。
  for(let pass=0; pass<OIL_SURFACE.blurPasses; pass++){
    const src=dens;
    const out=new Float32Array(src.length);
    for(let rz=0; rz<gridH; rz++){
      for(let cx=0; cx<gridW; cx++){
        let sum=0, wsum=0;
        for(let dz=-1; dz<=1; dz++){
          const zz=rz+dz; if(zz<0||zz>=gridH) continue;
          for(let dx=-1; dx<=1; dx++){
            const xx=cx+dx; if(xx<0||xx>=gridW) continue;
            const w=(dx===0&&dz===0)?5:(dx===0||dz===0)?2:1;
            sum += src[zz*gridW+xx]*w;
            wsum += w;
          }
        }
        out[rz*gridW+cx]=sum/wsum;
      }
    }
    dens=out;
  }

  let targetY=new Float32Array(count);
  let targetX=new Float32Array(count);
  let targetZ=new Float32Array(count);
  let vi=0;
  for(let rz=0;rz<=rows;rz++){
    const vz=rz/rows;
    const baseZ=lerp(OIL_SURFACE.minZ,OIL_SURFACE.maxZ,vz);
    for(let cx=0;cx<=cols;cx++){
      const ux=cx/cols;
      const baseX=lerp(OIL_SURFACE.minX,OIL_SURFACE.maxX,ux);
      const density=dens[rz*gridW+cx];

      // 更宽的软边：视觉轮廓提前抬升，避免锯齿状穿出地板。
      const edge=smoothstep01((density-OIL_SURFACE.threshold*.42)/.50);
      let h=0;
      if(edge>0){
        const dome=Math.pow(edge,.58);
        const thick=18 + Math.tanh(density*.82)*46;
        const breathe=(Math.sin(time*.95+baseX*.015+baseZ*.010)+Math.sin(time*.63+baseX*.008-baseZ*.013))*.34;
        h=dome*(thick+breathe);
      }

      const rebound=oilReboundAt(baseX,baseZ,time);
      const traction=oilTractionAt(baseX,baseZ,time);
      const stringPull=oilStringTractionAt(baseX,baseZ,time);
      const peel=oilPeelAt(baseX,baseZ,time);
      const volumeBulge=oilVolumeBulgeAt(baseX,baseZ,time);
      const pressureWave=oilPressureWaveAt(baseX,baseZ,time);
      const backflow=oilBackflowAt(baseX,baseZ,time);
      const massPull=oilMassPullAt(baseX,baseZ);
      const suctionDent=oilSuctionDentAt(baseX,baseZ);
      h += rebound + traction + stringPull.lift + peel.lift + volumeBulge + pressureWave + backflow + suctionDent + massPull.lift;

      const edgePull=Math.pow(edge,.62);
      targetX[vi]=baseX + (stringPull.x + peel.x + massPull.x)*edgePull;
      targetZ[vi]=baseZ + (stringPull.z + peel.z + massPull.z)*edgePull;
      targetY[vi]=OIL_SURFACE.surfaceBaseY + edge*((-OIL_SURFACE.surfaceBaseY)+h);
      vi++;
    }
  }

  // 再平滑目标高度，让边缘形成连续圆坡，而不是三角形“牙齿”。
  for(let pass=0;pass<OIL_SURFACE.edgeSmoothPasses;pass++){
    const src=targetY;
    const out=new Float32Array(src.length);
    for(let rz=0;rz<gridH;rz++){
      for(let cx=0;cx<gridW;cx++){
        let sum=0,wsum=0;
        for(let dz=-1;dz<=1;dz++){
          const zz=rz+dz;if(zz<0||zz>=gridH)continue;
          for(let dx=-1;dx<=1;dx++){
            const xx=cx+dx;if(xx<0||xx>=gridW)continue;
            const w=(dx===0&&dz===0)?7:(dx===0||dz===0)?2:1;
            sum+=src[zz*gridW+xx]*w;wsum+=w;
          }
        }
        out[rz*gridW+cx]=sum/wsum;
      }
    }
    targetY=out;
  }

  // 欠阻尼弹簧 + 邻域耦合：中心先变形，周围一圈稍晚被带动，读起来更像厚果冻在传播。
  const springSrc = force ? null : oilSpringY.slice();
  for(let i=0;i<count;i++){
    const ty=targetY[i];
    if(force){
      oilSpringY[i]=ty;
      oilSpringV[i]=0;
    }else{
      const cur=springSrc[i];
      const cx=i%gridW, rz=(i/gridW)|0;
      let neighborSum=0, neighborCount=0;
      if(cx>0){ neighborSum+=springSrc[i-1]; neighborCount++; }
      if(cx<gridW-1){ neighborSum+=springSrc[i+1]; neighborCount++; }
      if(rz>0){ neighborSum+=springSrc[i-gridW]; neighborCount++; }
      if(rz<gridH-1){ neighborSum+=springSrc[i+gridW]; neighborCount++; }
      const neighborAvg = neighborCount ? neighborSum/neighborCount : cur;
      const displacement=ty-cur;
      const coupling=(neighborAvg-cur)*OIL_SURFACE.springNeighborCoupling;
      const accel=displacement*OIL_SURFACE.springStiffness + coupling - oilSpringV[i]*OIL_SURFACE.springDamping;
      oilSpringV[i]+=accel*dt;
      oilSpringV[i]=Math.max(-OIL_SURFACE.springMaxSpeed,Math.min(OIL_SURFACE.springMaxSpeed,oilSpringV[i]));
      oilSpringY[i]=cur + oilSpringV[i]*dt;
    }

    arr[i*3+0]=targetX[i];
    arr[i*3+2]=targetZ[i];
    arr[i*3+1]=oilSpringY[i];
  }

  pos.needsUpdate=true;
  oilMesh.geometry.computeVertexNormals();
  oilSurfaceDirty=false;
}
function hideOilCell(c){
  if(!c||!c.active)return;
  c.active=false;
  c.pendingRemoval=false;
  c.targetStrength=0;
  c.removedAt=performance.now()/1000;
  spawnRecoverFlash(c.x,c.z,1.05 + c.noise*.32);
  oilSurfaceDirty=true;
}
function showAllOil(){
  oilCells.forEach(c=>{c.active=true;c.pendingRemoval=false;c.targetStrength=1;c.visualStrength=1;c.removedAt=-999});
  oilSurfaceDirty=true;
  updateOilSurface(performance.now()/1000,true);
}
function updateOilJellyVisuals(time,dt){updateOilCellVisuals(dt);updateOilSurface(time,false)}

function spawnRecoverFlash(x,z,scale=1){
  const g=new THREE.Group(); recoverGroup.add(g);
  // 底层不再做亮黄色闪光，而是先露出一块更深、更湿的地面。
  const base=new THREE.Mesh(recoverDiscGeo, new THREE.MeshBasicMaterial({color:0x6e5131,transparent:true,opacity:0,depthWrite:false}));
  base.rotation.x=-Math.PI/2; base.position.y=.06;
  const darkEdge=new THREE.Mesh(recoverGlowGeo, new THREE.MeshBasicMaterial({color:0x5b4027,transparent:true,opacity:0,depthWrite:false}));
  darkEdge.rotation.x=-Math.PI/2; darkEdge.position.y=.08;
  const ring=new THREE.Mesh(recoverRingGeo, new THREE.MeshBasicMaterial({color:0x9e7a4f,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.12;
  // 一条扫过去的湿润高光，用来强化“刚从油下面露出来”的质感。
  const sheen=new THREE.Mesh(recoverSheenGeo, new THREE.MeshBasicMaterial({color:0xfff7dc,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));
  sheen.rotation.x=-Math.PI/2; sheen.position.y=.16;
  sheen.rotation.z=Math.random()*Math.PI;
  g.add(base); g.add(darkEdge); g.add(ring); g.add(sheen);
  recoverEvents.push({g,base,darkEdge,ring,sheen,x,z,start:performance.now()/1000,dur:CFG.recoverFlashDuration,scale,twist:(Math.random()-.5)*.8});
}
function updateRecoverFlashes(){
  const now=performance.now()/1000;
  for(let i=recoverEvents.length-1;i>=0;i--){
    const e=recoverEvents[i];
    const t=Math.max(0,Math.min(1,(now-e.start)/e.dur));
    const wetIn=smoothstep01(Math.min(1,t/.16));
    const dryOut=smoothstep01((t-.40)/.60);
    const survive=1-dryOut;
    e.g.position.set(e.x,.02,e.z);

    // 主湿地块：先明显变深，再在 1s 左右逐渐干回正常地面。
    const baseS=18.5*e.scale*(.96 + .18*t);
    e.base.scale.set(baseS,baseS,1);
    e.base.material.opacity=(.38 + .18*wetIn) * survive;

    // 边缘更深一点，让湿地区域边界更容易看到，而不是融在亮地面里。
    const edgeS=22.0*e.scale*(.94 + .22*t);
    e.darkEdge.scale.set(edgeS,edgeS,1);
    e.darkEdge.material.opacity=(.16 + .08*wetIn) * (1-smoothstep01((t-.28)/.72));

    // 淡淡一圈暖棕收边，作为“刚清理干净”的句号，但不再用发亮黄环。
    const ringS=11.5*e.scale*(1+t*2.3);
    e.ring.scale.set(ringS,ringS,1);
    e.ring.material.opacity=(.11*(1-t)) * (1-smoothstep01((t-.10)/.90));

    // 湿润高光：前半段更明显，从一侧轻轻扫过，看起来像地表有一层湿膜。
    const sheenPulse=Math.sin(Math.min(1,t/.42)*Math.PI);
    const sheenW=(7.5 + 12*t)*e.scale;
    const sheenH=(1.8 + .25*Math.sin(t*Math.PI*2))*e.scale;
    e.sheen.scale.set(sheenW,sheenH,1);
    e.sheen.material.opacity=(.06 + .24*sheenPulse) * (1-smoothstep01((t-.46)/.54));
    e.sheen.rotation.z += e.twist*.013;

  }
}

function queueOilTransfer(cells,burst=false){
  const picked=(cells||[]).filter(c=>c&&c.active&&!c.pendingRemoval);
  if(!picked.length)return;
  let sx=0,sz=0;
  for(const c of picked){c.pendingRemoval=true;sx+=c.x;sz+=c.z}
  sx/=picked.length;sz/=picked.length;
  const g=new THREE.Group();oilTransferGroup.add(g);

    const m=new THREE.Mesh(oilTransferGeo,oilMat.clone());
    m.castShadow=true;m.material.transparent=true;g.add(m);parts.push(m);
  }

}

function updateOilTransfers(now){
  for(let i=oilTransferEvents.length-1;i>=0;i--){
    const e=oilTransferEvents[i];

    const n=nozzlePos();
    const dx=n.x-e.x,dz=n.z-e.z,len=Math.hypot(dx,dz)||1,dirx=dx/len,dirz=dz/len;
    const hold=e.burst?.20:.14;

    const p0={x:e.x,y:11.5,z:e.z};
    const p1={x:e.x+dirx*len*.28,y:16+(e.burst?5:2),z:e.z+dirz*len*.28};

    const p3={x:n.x,y:31,z:n.z};
    const p=bezierPoint(p0,p1,p2,p3,q);
    e.g.position.set(p.x,p.y,p.z);

    const stretch=1+.72*Math.sin(Math.min(1,t/Math.max(.001,hold))*Math.PI);
    const shrink=1-smoothstep01((q-.72)/.28)*.72;
    const base=(e.burst?9.4:7.0)*(1+.10*e.cells.length);
    for(let j=0;j<e.parts.length;j++){
      const m=e.parts[j],a=j/(e.parts.length-1||1);
      const wob=1+.08*Math.sin(now*14+j*2.1);

      m.scale.set(r*stretch,r*.78,r*1.05);
      m.material.opacity=Math.max(0,.98-smoothstep01((q-.78)/.22)*.92);
    }

    if(t>.72){
      const fade=1-smoothstep01((t-.72)/.28)*.82;

      oilSurfaceDirty=true;
    }
    if(t>=1){
      for(const c of e.cells)hideOilCell(c);
      oilTransferGroup.remove(e.g);
      for(const m of e.parts)m.material.dispose();
      oilTransferEvents.splice(i,1);
    }
  }
}

function inSuctionZone(c){
  if(!c||!c.active||c.pendingRemoval)return false;
  const n=nozzlePos(),v={x:c.x-n.x,z:c.z-n.z},d=Math.hypot(v.x,v.z);
  // 近身圆：解决油就在吸头旁边却因为扇形角度而检测不到的问题。
  if(d<=CFG.nearSuctionRadius)return true;
  if(d>CFG.suctionRange||d<1)return false;
  const nv={x:v.x/d,z:v.z/d};
  return Math.acos(Math.max(-1,Math.min(1,dot(nv,facing))))<=CFG.suctionHalfAngle;
}
function findTarget(){const n=nozzlePos();let best=null,bd=1e9;for(const c of oilCells){if(!inSuctionZone(c))continue;const d=dist(c,n);if(d<bd){bd=d;best=c}}return best}
function validTarget(c){return inSuctionZone(c)}
function advectOilTowardNozzle(dt){
  if(state!=='SUCTION' || !targetCell)return;
  const n=nozzlePos();
  const focus={x:targetCell.x,z:targetCell.z};
  const pulseMul=1+suctionPulseStrength*CFG.oilAdvectionPulseMul;
  let moved=false;
  for(const c of oilCells){
    if(!c.active||c.pendingRemoval)continue;
    const fd=Math.hypot(c.x-focus.x,c.z-focus.z);
    if(fd>=CFG.oilAdvectionRadius)continue;
    const dx=n.x-c.x,dz=n.z-c.z,d=Math.hypot(dx,dz);
    if(d<=CFG.oilAdvectionStopDistance)continue;
    const influence=Math.pow(1-fd/CFG.oilAdvectionRadius,1.42);
    const step=Math.min(
      CFG.oilAdvectionSpeed*influence*pulseMul*dt,
      Math.max(0,d-CFG.oilAdvectionStopDistance)
    );
    if(step<=0)continue;
    c.x+=dx/d*step;
    c.z+=dz/d*step;
    moved=true;
  }
  if(moved)oilSurfaceDirty=true;
}

function clearSuctionPatch(center){
  // 连续吸取先把一坨油拉离主体并飞向吸头，到达后才真正删除。
  const local=oilCells.filter(c=>c.active&&!c.pendingRemoval&&dist(c,center)<=CFG.suctionPatchRadius*1.20).sort((a,b)=>dist(a,center)-dist(b,center));
  if(!local.length)return;
  queueOilTransfer(local.slice(0,1),false);
  autoCleanResidualIslands();
}
function autoCleanResidualIslands(){
  // 极小残油也走同一条“脱离→飞入吸头”路径，不再原地消失。
  const active=oilCells.filter(c=>c.active&&!c.pendingRemoval);
  const visited=new Set();
  const tiny=[];
  for(const start of active){
    if(visited.has(start.index))continue;
    const stack=[start],comp=[];visited.add(start.index);
    while(stack.length){const cur=stack.pop();comp.push(cur);for(const other of active){if(visited.has(other.index))continue;if(dist(cur,other)<=CFG.residualLinkRadius){visited.add(other.index);stack.push(other)}}}
    if(comp.length<=CFG.residualIslandMaxCells)tiny.push(...comp);
  }
  if(tiny.length)queueOilTransfer(tiny,false);
}

  if(state==='SUCTION'){advectOilTowardNozzle(dt);suctionBudget+=CFG.suctionCellsPerSec*dt;while(suctionBudget>=1){suctionBudget--;const t=findTarget();if(!t)break;clearSuctionPatch(t);targetCell=findTarget()}const remaining=oilCells.reduce((n,c)=>n+(c.active?1:0),0);if(remaining/initialOilCount<=CFG.cleanupThreshold){state='FINISH';finishT=0;finishStartCount=remaining;targetCell=null;startFinishSentence()}}
}

function setCylinderBetween(mesh,a,b,radiusScale=1){const va=new THREE.Vector3(a.x,a.y,a.z),vb=new THREE.Vector3(b.x,b.y,b.z),mid=va.clone().add(vb).multiplyScalar(.5),dir=vb.clone().sub(va),len=dir.length();mesh.position.copy(mid);mesh.scale.set(radiusScale,len,radiusScale);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize())}
function currentRopeVisualPoints(){
  if(['CARRY','PRESUCTION','SUCTION','FINISH'].includes(state))return ropePoints();
  if(state==='RETRACT'&&retractPath.length){const info=pointOnPolylineInfo(retractPath,retractDist);const remain=retractPath.slice(info.i+1).reverse();return [machine,...remain,info.p]}
  return [];
}
function colorLerp(a,b,t){return a.clone().lerp(b,Math.max(0,Math.min(1,t)))}
function updateHoseFlow(dt){
  const pts=currentRopeVisualPoints();
  const currentLen=Math.max(0, polyLength(pts));
  if(state==='SUCTION' || state==='FINISH') hoseOilFillLen += CFG.hoseOilFillSpeed*dt;
  else hoseOilFillLen -= CFG.hoseOilDrainSpeed*dt;
  hoseOilFillLen=Math.max(0, Math.min(hoseOilFillLen, currentLen));
}
function updateRopeVisual(){
  const pts=currentRopeVisualPoints();
  const totalLen=polyLength(pts);
  let acc=0;
  const carrying=['CARRY','PRESUCTION','SUCTION','FINISH'].includes(state);
  const ropeRatio=carrying && CFG.hoseLimit>0 ? Math.min(1, ropeLength()/CFG.hoseLimit) : 0;
  const tensionAlpha=carrying && ropeRatio>=CFG.tensionStart ? Math.min(1,(ropeRatio-CFG.tensionStart)/(1-CFG.tensionStart)) : 0;
  const now=performance.now()/1000;
  const pulse=(Math.sin(now*11.5)+1)*.5;
  // 拉力阶段只轻微闪红，避免把蓝色软管整体染成粉色。
  const flashAlpha=tensionAlpha>0 ? (.03 + .10*pulse) * (.30 + .70*tensionAlpha) : 0;

  for(let i=0;i<ropeSegments.length;i++){
    const s=ropeSegments[i];
    if(i<pts.length-1){
      s.visible=true;
      const a=pts[i], b=pts[i+1];
      setCylinderBetween(s,{x:a.x,y:24,z:a.z},{x:b.x,y:26,z:b.z});
      const segLen=dist(a,b);
      const midFromMachine=acc + segLen*.5;
      const midFromNozzle=totalLen - midFromMachine;
      // 颜色前沿从吸头朝吸油机推进/回退，形成沿整根软管逐步流动的渐变。
      let fillT=(hoseOilFillLen - midFromNozzle + CFG.hoseFlowTransition*.5)/CFG.hoseFlowTransition;
      fillT=Math.max(0, Math.min(1, fillT));
      let col=colorLerp(ropeBaseColor, ropeOilColor, fillT);

      // 在已吸入的管段上增加缓慢移动的高光，像管内液体正在流动。
      let flowGlow=0;
      if(fillT>0.02){
        const wave=0.5 + 0.5*Math.sin(now*12.5 - midFromNozzle*0.09);
        const shimmer=Math.max(0,(wave-.58)/.42);
        const nearFront=Math.max(0,1-Math.abs(hoseOilFillLen-midFromNozzle)/(CFG.hoseFlowTransition*1.1));
        flowGlow=(.08 + .16*nearFront + .12*shimmer) * fillT;
        col.lerp(ropeFlowHighlightColor, Math.min(.38, flowGlow));
      }

      if(flashAlpha>0) col.lerp(ropeTensionColor, flashAlpha);
      s.material.color.copy(col);
      s.material.emissive.copy(colorLerp(new THREE.Color(0x000000), ropeFlowHighlightColor, Math.min(.20, flowGlow)));
      if(flashAlpha>0){
        s.material.emissive.r = Math.min(.12, s.material.emissive.r + flashAlpha*.12);
      }
      acc += segLen;
    } else s.visible=false
  }
  while(anchorGroup.children.length)anchorGroup.remove(anchorGroup.children[0]);if(['CARRY','PRESUCTION','SUCTION','FINISH'].includes(state)){for(const a of anchors){const m=new THREE.Mesh(new THREE.SphereGeometry(5,8,6),new THREE.MeshBasicMaterial({color:0xf3b944}));m.position.set(a.x,29,a.z);anchorGroup.add(m)}}
}
function updateFeedbackVisuals(){
  const rangeVisible=['CARRY','PRESUCTION','SUCTION'].includes(state);
  suctionRangeGroup.visible=rangeVisible;
  // 检测到有效油面时变绿，让“范围命中”一眼可见。
  const rangeHit=rangeVisible&&!!findTarget();

  rippleGroup.visible=state==='PRESUCTION'&&!!targetCell;if(rippleGroup.visible){rippleGroup.position.set(targetCell.x,4.7,targetCell.z);const t=preT/CFG.preSuction;rippleMeshes.forEach((r,i)=>{const phase=(t+i*.2)%1;r.scale.setScalar(.8+phase*2.4);r.material.opacity=.45*(1-phase)})}
  // 吸头前的主体表现交给史莱姆拉丝，避免这条吸流柱看起来像一根黑管。
  stream.visible=(state==='FINISH');if(stream.visible){let tx,tz;const act=oilCells.filter(c=>c.active);if(act.length){tx=act.reduce((n,c)=>n+c.x,0)/act.length;tz=act.reduce((n,c)=>n+c.z,0)/act.length}else{const n=nozzlePos();tx=n.x+facing.x*60;tz=n.z+facing.z*60}const n=nozzlePos();setCylinderBetween(stream,{x:tx,y:8,z:tz},{x:n.x,y:30,z:n.z},0.72)}
  updateOilFlowVisual();

function updateVisuals(){
  playerGroup.position.set(player.x,0,player.z);playerGroup.rotation.y=Math.atan2(facing.x,facing.z);nozzle.visible=['CARRY','PRESUCTION','SUCTION','FINISH'].includes(state);
  pickupRing.visible=state==='IDLE'||state==='PICKUP';updateRopeVisual();updateFeedbackVisuals();updateNozzleVortexVisual();updateOilTongueVisual();
  // camera follows without changing yaw, so touch movement stays intuitive.
  // 拿起吸头后机器持续运转：持管阶段保持极轻微震屏；正式吸油和收尾阶段明显加强。
  const camX=player.x*.24, camZ=player.z*.18+650;
  const baseCam=new THREE.Vector3(camX,610,camZ);
  camera.position.lerp(baseCam,.06);

  const t=performance.now()/1000;
  let targetShake=0, targetFreq=CFG.cameraShakeFreqCarry;
  if(state==='CARRY'){ targetShake=CFG.cameraShakeCarry; targetFreq=CFG.cameraShakeFreqCarry; }
  else if(state==='PRESUCTION'){ targetShake=CFG.cameraShakePreSuction; targetFreq=CFG.cameraShakeFreqPreSuction; }
  else if(state==='SUCTION'){ targetShake=CFG.cameraShakeSuction; targetFreq=CFG.cameraShakeFreqSuction; }
  else if(state==='FINISH'){ targetShake=CFG.cameraShakeFinish; targetFreq=CFG.cameraShakeFreqFinish; }

  // 平滑过渡，避免拿起/开始吸油瞬间像“镜头被敲了一下”。
  const blend=1-Math.exp(-CFG.cameraShakeBlendSpeed/60);
  cameraShakeCurrent=lerp(cameraShakeCurrent,targetShake,blend);
  cameraShakeFreqCurrent=lerp(cameraShakeFreqCurrent,targetFreq,blend);

  const look=new THREE.Vector3(player.x*.20,0,player.z*.20-40);
  if(camera.fov!==47){ camera.fov=47; camera.updateProjectionMatrix(); }
  camera.lookAt(look);

  if(cameraShakeCurrent>.005){
    // 持续机械震动改成“屏幕空间上下为主”。
    // 原因：机器运转需要稳定、可读的振动方向；多轴随机晃更像爆炸/受击。
    const f=cameraShakeFreqCurrent;
    const vertical=(Math.sin(t*f*1.03)*.72 + Math.sin(t*f*2.17)*.28) * cameraShakeCurrent;
    const lateral=(Math.sin(t*f*.83+1.2)*.10 + Math.sin(t*f*1.91)*.05) * cameraShakeCurrent;
    camera.translateY(vertical);
    camera.translateX(lateral);
  }

  // 周期性“大吸一口”和最后一口都给一个很短的冲击，不改变持续震动的基线。
  if(suctionPunchT>0){
    const q=suctionPunchT/.18;
    camera.translateY(Math.sin((1-q)*Math.PI)*1.8*q);
    camera.translateZ(-1.1*q);
  }
  if(finishPunchT>0){
    const q=finishPunchT/.26;
    camera.translateY(Math.sin((1-q)*Math.PI)*3.0*q);
    camera.translateZ(-2.2*q);
  }

  // 极限软管拉回仍然用多方向短冲击，与“持续机器震动”区分开。
  if(shakeT>0){
    const impulse=shakeT/.16;
    camera.translateX(Math.sin(t*58)*5.2*impulse);
    camera.translateY(Math.cos(t*71)*3.2*impulse);
    camera.translateZ(Math.sin(t*64)*2.5*impulse);
  }
}
function updateUI(){
  const carrying=['CARRY','PRESUCTION','SUCTION','FINISH'].includes(state);dropBtn.style.display=carrying?'block':'none';dropBtn.disabled=state==='FINISH';dropBtn.style.opacity=state==='FINISH'?'.45':'1';pickupBar.style.display=state==='PICKUP'?'block':'none';pickupFill.style.width=(Math.min(1,pickupT/CFG.interactionDuration)*100)+'%';
  const texts={IDLE:['靠近吸油机拿取吸头','进入黄色交互圈并停留，系统自动拿管。'],PICKUP:['正在拿取吸头','离开交互圈会立即清零。'],CARRY:['持管移动','靠近油面边缘，并让角色面朝油面。'],PRESUCTION:['预吸建立中','保持朝向，波纹结束后自动正式吸取。'],SUCTION:['正在吸油','油面退缩后，裸露地面即可进入。'],FINISH:['残油自动收尾','达到隐藏阈值：移动锁定，残油自动汇聚清空。'],RETRACT:['软管自动回收','回收完成前不能重新拿管。']};statusEl.textContent=texts[state][0];hintEl.textContent=texts[state][1];
  if(carrying){const R=ropeLength()/CFG.hoseLimit;tensionBadge.textContent=R>=1?'软管：极限':R>=CFG.tensionStart?'软管：受力':'软管：松弛';tensionBadge.style.background=R>=1?'#6d2d2a':R>=CFG.tensionStart?'#6b5528':'#2d4932'}else{tensionBadge.textContent='软管：未连接';tensionBadge.style.background='#2d343c'}
  if(showDebug){const rem=oilCells.reduce((n,c)=>n+(c.active?1:0),0);debugEl.innerHTML=`<b>3D MVP 调试</b><br>state: ${state}<br>hose: ${carrying?ropeLength().toFixed(0):0} / ${CFG.hoseLimit}<br>anchors: ${anchors.length}<br>oil cells: ${rem} / ${initialOilCount}<br>pre-suction: ${preT.toFixed(2)}s<br>camera shake: ${cameraShakeCurrent.toFixed(2)} / freq ${cameraShakeFreqCurrent.toFixed(1)}<br>suction range: near ${CFG.nearSuctionRadius} + forward ${CFG.suctionRange} / ±${(CFG.suctionHalfAngle*180/Math.PI).toFixed(0)}°<br>oil collision circle: r=${CFG.oilCollisionRadius} / offset ${CFG.oilCollisionForwardOffset}<br><span style="color:#9aa7b4">H 隐藏</span>`}
}
function showToast(msg){toast.textContent=msg;toast.style.opacity=1;clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.style.opacity=0,1300)}

function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.toLowerCase()==='h'){showDebug=!showDebug;debugEl.classList.toggle('hidden',!showDebug);updateUI()}if(e.key===' '){dropHose();e.preventDefault()}});
window.addEventListener('keyup',e=>keys[e.key]=false);dropBtn.addEventListener('click',dropHose);resetBtn.addEventListener('click',()=>{reset();showToast('场景已重置')});
renderer.domElement.addEventListener('pointerdown',e=>{pointerId=e.pointerId;renderer.domElement.setPointerCapture(e.pointerId);const r=renderer.domElement.getBoundingClientRect();joyOrigin={x:e.clientX-r.left,y:e.clientY-r.top};joystick.style.left=joyOrigin.x+'px';joystick.style.top=joyOrigin.y+'px';joystick.style.display='block'});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==pointerId||!joyOrigin)return;const r=renderer.domElement.getBoundingClientRect(),dx=e.clientX-r.left-joyOrigin.x,dy=e.clientY-r.top-joyOrigin.y,m=Math.hypot(dx,dy),max=40,k=m>max?max/m:1;touchVec={x:(dx*k)/max,z:(dy*k)/max};stick.style.transform=`translate(calc(-50% + ${dx*k}px),calc(-50% + ${dy*k}px))`});
function endPointer(e){if(e.pointerId!==pointerId)return;pointerId=null;joyOrigin=null;touchVec={x:0,z:0};joystick.style.display='none';stick.style.transform='translate(-50%,-50%)'}renderer.domElement.addEventListener('pointerup',endPointer);renderer.domElement.addEventListener('pointercancel',endPointer);

reset();let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
